name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pdftotext and mutool, so the extraction, outline and end-to-end tests run instead of skipping
      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils mupdf-tools

      - name: Install paperpipe
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  smoke:
    name: CLI smoke (no network)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install paperpipe
        run: pip install -e .

      - name: Verify the installed entry point
        run: |
          paperpipe --version
          python -m paperpipe --help > /dev/null
          paperpipe --data-dir "$RUNNER_TEMP/data" stats

  docker:
    name: Docker image builds with PDF tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --tag paperpipe:ci .

      # The deployed web UI's Extract button needs these on the image's PATH.
      - name: Check the image
        run: |
          docker run --rm paperpipe:ci sh -c '
            set -e
            pdftotext -v
            mutool -v
            paperpipe --version
            python -c "from paperpipe import extract; assert extract.available_backend() == \"pdftotext\""
          '
