[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpipe"
version = "0.1.0"
description = "Research paper data pipeline: arXiv search -> PDFs + metadata -> text/TOC extraction -> SQLite + JSON index -> markdown export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24", "pybtex>=0.24"]
web = ["fastapi>=0.100", "uvicorn>=0.23"]

[project.scripts]
paperpipe = "paperpipe.cli:main"

[tool.setuptools]
packages = ["paperpipe"]

[tool.setuptools.package-data]
paperpipe = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
